<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040404" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#888888" media="(prefers-color-scheme: light)" />

    <!-- seo:start — replaced per route by scripts/prerender.mjs at build time -->
    <title>Akash Rengaraj | Terminal Portfolio</title>
    <meta name="description" content="Akash Rengaraj — 3rd-year AI &amp; Data Science student at SKCET (CGPA 8.22), Data Science club tech leader and full-stack developer." data-prerender />
    <link rel="canonical" href="https://www.akashr.dev/" data-prerender />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="akashr.dev" />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://www.akashr.dev/" />
    <meta property="og:title" content="Akash Rengaraj | Terminal Portfolio" />
    <meta property="og:description" content="AI &amp; Data Science student and full-stack developer. Projects in multi-agent AI, AR, Flutter, React and IoT." />
    <meta property="og:image" content="https://www.akashr.dev/og/home.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@akash_020160" />
    <meta name="twitter:image" content="https://www.akashr.dev/og/home.jpg" />
    <!-- seo:end -->
    <meta name="author" content="Akash Rengaraj" />
    <link rel="alternate" type="application/rss+xml" title="Akash Rengaraj — devlog" href="/blog/rss.xml" />
    <link rel="author" href="/llms.txt" type="text/plain" />

    <!-- Pre-rendered page text is for crawlers and no-JS readers; the app replaces it -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'light' || (!theme && matchMedia('(prefers-color-scheme: light)').matches)) root.classList.add('pre-light');
        } catch (e) { /* storage blocked: stay dark */ }
      })();
    </script>
    <style>
      html { background: #040404; }
      html.pre-light { background: #888888; }
      html.js #seo-static { display: none; }
      html:not(.js) .pre-boot { display: none; }
      .pre-boot { position: fixed; inset: 0; display: grid; place-items: center; background: #040404; color: #3dffb8; font: 14px/1 'Fira Code', ui-monospace, monospace; }
      .pre-light .pre-boot { background: #888888; color: #06281d; }
      .pre-boot span { opacity: .55; margin-right: .6ch; }
      .pre-boot i { display: inline-block; width: .6em; height: 1.1em; margin-left: .3ch; vertical-align: -.2em; background: currentColor; animation: pre-blink 1s steps(1) infinite; }
      @keyframes pre-blink { 50% { opacity: 0; } }
      #seo-static { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; color: #d7e0dc; font: 16px/1.65 system-ui, sans-serif; }
      #seo-static a { color: #3dffb8; }
      #seo-static nav ul { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0; list-style: none; }
      #seo-static pre { overflow-x: auto; }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <!-- Fonts & Icons -->
    <!-- Fonts & icons load without blocking the first paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    </noscript>
</head>
  <body>
    <div id="root"><div class="pre-boot" aria-hidden="true"><p><span>$</span>booting akashr.dev<i></i></p></div><!-- static-content --></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
